# List any related terraform modules that this module may be used with or that this module depends on.
related:
  - name: "terraform-oci-nosql"
    description: "Terraform module that implements OCI NoSQL Table with support for AutoScaling"
    url: "https://github.com/cloudposse/terraform-oci-nosql"
  - name: "terraform-oci-object-storage"
    description: "Terraform module to provision OCI Object Storage bucket"
    url: "https://github.com/cloudposse/terraform-oci-object-storage"

# Short description of this project
description: |-
  This module provisions resources on Oracle Cloud Infrastructure (OCI) to support Terraform state storage and locking. It replaces AWS S3 and DynamoDB with OCI Object Storage and NoSQL Table.

inputs:
  - name: oci_namespace
    description: The namespace of the OCI Object Storage bucket.
    type: string
    required: true
  - name: compartment_id
    description: The OCID of the compartment where resources will be created.
    type: string
    required: true
  - name: bucket_enabled
    description: Whether to create the OCI Object Storage bucket.
    type: bool
    default: true
  - name: table_enabled
    description: Whether to create the OCI NoSQL table.
    type: bool
    default: true
  - name: storage_tier
    description: "The storage tier of the bucket. Valid values: Standard, InfrequentAccess, Archive."
    type: string
    default: Standard
  - name: public_access_type
    description: "The type of public access for the bucket. Valid values: NoPublicAccess, ObjectRead, ObjectReadWithoutList."
    type: string
    default: NoPublicAccess
  - name: versioning
    description: "The versioning status of the bucket. Valid values: Enabled, Suspended."
    type: string
    default: Enabled
  - name: force_destroy
    description: Whether the bucket can be destroyed even if it contains objects.
    type: bool
    default: false
  - name: max_read_units
    description: Maximum read units for the NoSQL table.
    type: number
    default: 10
  - name: max_write_units
    description: Maximum write units for the NoSQL table.
    type: number
    default: 10
  - name: max_storage_in_gbs
    description: Maximum storage in GBs for the NoSQL table.
    type: number
    default: 10
  - name: tags
    description: A map of tags to assign to resources.
    type: map(string)
    default: {}

outputs:
  - name: bucket_name
    description: The name of the OCI Object Storage bucket.
  - name: bucket_namespace
    description: The namespace of the OCI Object Storage bucket.
  - name: bucket_compartment_id
    description: The compartment ID of the OCI Object Storage bucket.
  - name: nosql_table_name
    description: The name of the OCI NoSQL table.
  - name: nosql_table_compartment_id
    description: The compartment ID of the OCI NoSQL table.

include:
  - "docs/targets.md"
  - "docs/terraform.md"

